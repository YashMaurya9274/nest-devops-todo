apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: DOCKER_USERNAME/todo-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: MONGO_URI

            - name: COOKIE_NAME
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: COOKIE_NAME

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: JWT_SECRET

            - name: TODO_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: TODO_API_KEY

          imagePullPolicy: Never
