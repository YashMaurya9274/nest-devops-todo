apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nest-devops-todo-api-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
spec:
  ingressClassName: nginx
  rules:
    - host: api.todoapp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nest-devops-todo-api-service
                port:
                  number: 3000
