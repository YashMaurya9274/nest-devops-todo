version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: todo-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    container_name: todo-api
    restart: always
    env_file:
      - .env
    environment:
      MONGO_URI: ${MONGO_URI}
    ports:
      - '3000:3000'
    depends_on:
      - mongo

volumes:
  mongo-data:
